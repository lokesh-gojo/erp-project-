      <header>
        <h1>PREP-TRACK - Intelligent Examination & Campus Placement Platform</h1>
        <p>An IEEE-standard adaptive learning and placement assessment ecosystem designed by Lokesh (lokesh-gojo) at EASA College of Engineering and Technology, Coimbatore, Tamil Nadu, India.</p>
      </header>
      <main>
        <section>
          <h2>Core Modules & Scientific Foundations</h2>
          <ul>
            <li><strong>2-Parameter Logistic Item Response Theory (2PL-IRT):</strong> Dynamic Computerized Adaptive Testing (CAT) with Maximum Fisher Information.</li>
            <li><strong>Bloom's Revised Cognitive Taxonomy (L1-L6):</strong> Natural Language Processing profiling of engineering test stems.</li>
            <li><strong>Explainable AI (XAI) Placement Readiness:</strong> SHAP-inspired feature attribution for Tier-1 Product, Tier-2 Specialist, and Tier-3 IT Services recruiting.</li>
            <li><strong>Outcome-Based Education (OBE):</strong> Direct Program Outcome (PO1-PO12) attainment mapping adhering to Washington Accord guidelines.</li>
            <li><strong>Multimodal Exam Integrity:</strong> Temporal pacing and anomaly analysis computing the Cheating Susceptibility Index (CSI).</li>
            <li><strong>Autonomous RAG Agent:</strong> Hybrid BM25 and vector semantic doubt clearing for engineering syllabi and university question papers.</li>
          </ul>
        </section>
      </main>
